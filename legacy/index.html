<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Painel de Controle — Forklift Dispatch</title>
<style>
  :root{
    --bg-void:#06070a;
    --panel-base:#0e1116;
    --panel-raised:#171c22;
    --panel-raised-hi:#1e242c;
    --panel-line:#262e38;
    --accent-amber:#f5a524;
    --accent-amber-dim:#8a611c;
    --accent-cyan:#2dd4bf;
    --accent-cyan-dim:#1c766c;
    --text-primary:#edeff3;
    --text-muted:#8a93a3;
    --state-error:#f45b69;
    --icon-gray:#9aa4b3;
  }

  *{ box-sizing:border-box; }

  html,body{
    height:100%;
    margin:0;
    background:var(--panel-base);
    color:var(--text-primary);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }

  .device{
    container-type:size;
    container-name:panel;
    width:100vw;
    height:100vh;
    display:flex;
    flex-direction:column;
  }

  /* --- células fixas: marcação visual, não clicável -------------------- */
  .cells{
    flex:0 0 26cqh;
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    align-items:center;
  }

  .cell{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:1.4cqh;
  }
  .cell--a{ grid-column:1; justify-self:center; }
  .cell--b{ grid-column:4; justify-self:center; }

  .cell__icon{
    width:9cqh;
    height:9cqh;
    color:var(--icon-gray);
    display:block;
  }
  .cell__icon svg{ width:100%; height:100%; display:block; }

  .cell__label{
    font-family:"Arial Black","Helvetica Neue",Arial,sans-serif;
    font-weight:900;
    font-size:2.4cqh;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--text-primary);
  }

  /* --- ações centrais: cancelar / emergência, entre as células ---------- */
  .mid-actions{
    grid-column:2 / 4;
    justify-self:center;
    display:flex;
    align-items:center;
    gap:6cqw;
  }

  .mid-btn{
    all:unset;
    box-sizing:border-box;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:1cqh;
    cursor:pointer;
  }

  .mid-btn__circle{
    width:10cqh;
    height:10cqh;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:transform .08s ease, filter .12s ease;
    box-shadow:0 2px 0 rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.1);
  }
  .mid-btn:hover .mid-btn__circle{ filter:brightness(1.1); }
  .mid-btn:active .mid-btn__circle{ transform:scale(0.94); }
  .mid-btn:focus-visible .mid-btn__circle{ outline:3px solid var(--accent-cyan); outline-offset:3px; }

  .mid-btn--home .mid-btn__circle{ background:#2ecc71; color:#06210f; }
  .mid-btn--home svg{ width:52%; height:52%; }

  .mid-btn--estop .mid-btn__circle{ background:#e0202b; }
  .mid-btn--estop .mid-btn__square{ width:34%; height:34%; background:#fff; border-radius:2px; }

  .mid-btn__label{
    font-family:"Arial Black","Helvetica Neue",Arial,sans-serif;
    font-weight:900;
    font-size:1.5cqh;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--text-muted);
  }

  /* --- construção de lotes de armazenamento ----------------------------- */
  .workspace{
    flex:1;
    min-height:0;
    border-top:1px solid var(--panel-line);
    display:flex;
    align-items:center;
    padding:2cqh 4cqw;
  }

  /* Mesma referência de quartis usada nas células: 4 colunas de largura
     igual cobrindo a página inteira, cada slot centralizado na sua. */
  .batch-grid{
    width:100%;
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    align-items:center;
    justify-items:center;
  }

  .lot-card{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:1.2cqh;
  }

  .lot-card__label{
    font-family:"Arial Black","Helvetica Neue",Arial,sans-serif;
    font-weight:900;
    font-size:2cqh;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--text-primary);
  }

  .lot-card__square{
    container-type:size;
    width:32cqmin;
    height:32cqmin;
    overflow:hidden;
  }

  .lot-card__actions{
    display:flex;
    gap:1.4cqh;
  }

  .icon-btn{
    all:unset;
    box-sizing:border-box;
    cursor:pointer;
    width:4.4cqh;
    height:4.4cqh;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    color:var(--text-muted);
    background:var(--panel-raised);
    border:1px solid var(--panel-line);
    transition:color .12s ease, border-color .12s ease, background .12s ease;
  }
  .icon-btn svg{ width:52%; height:52%; }
  .icon-btn__glyph{ font-family:ui-monospace,"SF Mono","Cascadia Code",monospace; font-weight:700; font-size:1.6cqh; }
  .icon-btn:hover{ color:var(--text-primary); border-color:var(--icon-gray); }
  .icon-btn:focus-visible{ outline:2px solid var(--accent-cyan); outline-offset:2px; }
  .icon-btn--danger:hover{ color:var(--state-error); border-color:var(--state-error); }

  .slot-add{
    all:unset;
    box-sizing:border-box;
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    border-radius:14cqmin;
    background:linear-gradient(180deg, var(--panel-raised) 0%, #10141a 100%);
    border:1px dashed var(--panel-line);
    color:var(--text-muted);
    font-size:36cqmin;
    font-weight:300;
    line-height:1;
    transition:background .12s ease, color .12s ease, border-color .12s ease;
  }
  .slot-add:hover{
    color:var(--text-primary);
    border-color:var(--icon-gray);
    background:linear-gradient(180deg, var(--panel-raised-hi) 0%, #141a21 100%);
  }
  .slot-add:focus-visible{ outline:3px solid var(--accent-cyan); outline-offset:4px; }

  .lot{
    width:100%;
    height:100%;
    box-sizing:border-box;
    display:grid;
    gap:4%;
    padding:5%;
    background:var(--panel-raised);
    border:1px solid var(--panel-line);
    border-radius:14cqmin;
  }

  /* Cada célula é seu próprio container de consulta: a fonte é dimensionada
     em relação ao tamanho real que a própria célula recebeu do grid (1fr),
     então funciona pra qualquer N de colunas/linhas sem cálculo manual. */
  .lot__cell{
    all:unset;
    container-type:inline-size;
    box-sizing:border-box;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    cursor:pointer;
    background:linear-gradient(180deg, #171c22 0%, #10141a 100%);
    border:1px solid var(--panel-line);
    border-radius:20cqmin;
    color:var(--text-primary);
    font-family:ui-monospace,"SF Mono","Cascadia Code",monospace;
    font-weight:600;
    font-size:clamp(6px, 26cqw, 15px);
    white-space:nowrap;
    text-align:center;
    transition:border-color .12s ease, background .12s ease;
  }
  .lot__cell:hover{ border-color:var(--accent-cyan); background:linear-gradient(180deg,#1a2128,#12171d); }
  .lot__cell-label{ font-size:1em; line-height:1.1; }
  .lot__cell-task{
    font-size:0.6em;
    line-height:1.1;
    color:var(--accent-amber);
    opacity:0.9;
  }
  .lot__cell:focus-visible{ outline:2px solid var(--accent-cyan); outline-offset:1px; }

  /* --- modal de criação de lote ------------------------------------------ */
  .modal-backdrop{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.6);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:1000;
  }
  .modal-backdrop[hidden]{ display:none; }

  /* O modal de olho/dev (lote expandido) usa a camada base (1000). Qualquer
     modal que precise poder aparecer sobreposto a ele (bind de task,
     confirmação de exclusão) usa a camada acima (1100). */
  #taskIdBackdrop, #deleteBackdrop{ z-index:1100; }

  .modal{
    position:relative;
    width:min(420px, 90vw);
    background:var(--panel-raised);
    border:1px solid var(--panel-line);
    border-radius:16px;
    padding:24px;
    box-shadow:0 30px 60px -20px rgba(0,0,0,0.7);
    display:flex;
    flex-direction:column;
    gap:16px;
  }
  .modal__close{
    all:unset;
    box-sizing:border-box;
    position:absolute;
    top:12px;
    right:12px;
    width:32px;
    height:32px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    background:var(--panel-base);
    border:1px solid var(--panel-line);
    color:var(--text-muted);
    font-size:18px;
    line-height:1;
    cursor:pointer;
  }
  .modal__close:hover{ color:var(--text-primary); border-color:var(--icon-gray); }
  .modal__close:focus-visible{ outline:2px solid var(--accent-cyan); outline-offset:2px; }
  .modal__text{
    margin:0;
    font-size:14px;
    line-height:1.5;
    color:var(--text-muted);
  }
  .modal__text strong{ color:var(--text-primary); }
  .modal__title{
    margin:0;
    font-size:20px;
    font-weight:700;
    color:var(--text-primary);
  }

  .field{ display:flex; flex-direction:column; gap:6px; }
  .field__label{
    font-size:12px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--text-muted);
  }
  .field__input{
    background:var(--panel-base);
    border:1px solid var(--panel-line);
    border-radius:8px;
    padding:10px 12px;
    color:var(--text-primary);
    font-size:16px;
  }
  .field__input:focus-visible{ outline:2px solid var(--accent-cyan); outline-offset:1px; }
  .field-row{ display:flex; gap:12px; }
  .field-row .field{ flex:1; }
  .field--checkbox{ flex-direction:row; align-items:center; gap:8px; }
  .field--checkbox input{ width:18px; height:18px; accent-color:var(--accent-cyan); }
  .field--checkbox span{ color:var(--text-primary); font-size:14px; }

  .modal__actions{ display:flex; justify-content:flex-end; gap:10px; margin-top:8px; }
  .btn{
    all:unset;
    box-sizing:border-box;
    padding:10px 18px;
    border-radius:8px;
    font-weight:600;
    font-size:14px;
    cursor:pointer;
  }
  .btn--ghost{ color:var(--text-muted); border:1px solid var(--panel-line); }
  .btn--ghost:hover{ color:var(--text-primary); border-color:var(--icon-gray); }
  .btn--primary{ background:var(--accent-cyan); color:#04211c; }
  .btn--primary:hover{ filter:brightness(1.08); }
  .btn--danger{ background:var(--state-error); color:#2a0508; }
  .btn--danger:hover{ filter:brightness(1.08); }
  .btn--danger:disabled{ opacity:.4; cursor:not-allowed; filter:none; }

  /* --- lote expandido (olho / modo desenvolvedor) ------------------------ */
  .lot-view{
    width:82vw;
    height:82vh;
    box-sizing:border-box;
    background:var(--panel-raised);
    border:1px solid var(--panel-line);
    border-radius:20px;
    box-shadow:0 40px 80px -20px rgba(0,0,0,0.75);
    padding:28px;
    display:flex;
    flex-direction:column;
    gap:20px;
    position:relative;
  }

  .lot-view__close{
    all:unset;
    box-sizing:border-box;
    position:absolute;
    top:16px;
    right:16px;
    width:40px;
    height:40px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    background:var(--panel-base);
    border:1px solid var(--panel-line);
    color:var(--text-muted);
    font-size:22px;
    line-height:1;
    cursor:pointer;
  }
  .lot-view__close:hover{ color:var(--text-primary); border-color:var(--icon-gray); }
  .lot-view__close:focus-visible{ outline:2px solid var(--accent-cyan); outline-offset:2px; }

  .lot-view__header{ display:flex; align-items:center; gap:14px; }
  .lot-view__title{
    font-family:"Arial Black","Helvetica Neue",Arial,sans-serif;
    font-weight:900;
    font-size:28px;
    letter-spacing:0.02em;
    color:var(--text-primary);
  }
  .lot-view__badge{
    font-family:ui-monospace,"SF Mono","Cascadia Code",monospace;
    font-size:12px;
    font-weight:700;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:#221604;
    background:var(--accent-amber);
    padding:4px 10px;
    border-radius:999px;
  }

  .lot-view__grid{
    container-type:size;
    flex:1;
    min-height:0;
  }

  /* --- toast de feedback -------------------------------------------------- */
  .toast{
    position:fixed;
    left:50%;
    bottom:28px;
    transform:translate(-50%, 12px);
    max-width:min(86vw, 640px);
    padding:12px 22px;
    border-radius:10px;
    font-family:ui-monospace,"SF Mono","Cascadia Code",monospace;
    font-size:14px;
    letter-spacing:0.02em;
    text-align:center;
    color:var(--text-primary);
    background:var(--panel-raised);
    border:1px solid var(--panel-line);
    border-left:4px solid var(--text-muted);
    box-shadow:0 20px 40px -16px rgba(0,0,0,0.6);
    opacity:0;
    pointer-events:none;
    transition:opacity .2s ease, transform .2s ease;
    z-index:1200;
  }
  .toast.is-visible{ opacity:1; transform:translate(-50%, 0); }
  .toast--success{ border-left-color:var(--accent-cyan); }
  .toast--error{ border-left-color:var(--state-error); }
  .toast--info{ border-left-color:var(--accent-amber); }

  /* --- assinatura de marca (canto inferior direito) --------------------- */
  .brand-footer{
    position:fixed;
    right:2cqw;
    bottom:1.6cqh;
    display:flex;
    align-items:center;
    gap:1cqw;
    pointer-events:none;
    z-index:10;
  }
  .brand-footer__logo{ height:3.4cqh; width:auto; color:var(--text-primary); display:block; }
  .brand-footer__logo svg{ height:100%; width:auto; display:block; }
  .brand-footer__text{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:1.3cqh;
    letter-spacing:0.03em;
    color:var(--text-muted);
    white-space:nowrap;
  }
  .brand-footer__text strong{ color:var(--text-primary); font-weight:800; }
</style>
</head>

        <span class="mid-btn__label">Cancelar</span>
      </button>

      <button type="button" class="mid-btn mid-btn--estop" id="estopBtn" aria-label="Parada de emergência">
        <span class="mid-btn__circle" aria-hidden="true">
          <span class="mid-btn__square"></span>
        </span>
        <span class="mid-btn__label">Emergência</span>
      </button>
    </div>

    <div class="cell cell--b">
      <span class="cell__icon" aria-hidden="true">
        <svg viewBox="0 0 32 32" fill="currentColor">

        </svg>
      </span>
      <span class="cell__label">Célula-B</span>
    </div>
  </div>

  <div class="workspace" id="workspace">
    <div class="batch-grid" id="batchGrid"></div>
  </div>
</div>

<script>
(function () {
  'use strict';

  // -----------------------------------------------------------------------
  // CONFIGURAÇÃO — validada na apresentação. Reaproveitar ao remontar a UI.
  // -----------------------------------------------------------------------
  const CONFIG = {
    API_BASE: '/api/reeman-dispatch-service', // caminho relativo -> proxy local (server.py)
    PROJECT_ID: 13,
    TASK_ID_A_TO_B: 67,  // template "fast task" -> ponto A para ponto B
    TASK_ID_B_TO_A: 68,  // template "fast task" -> ponto B para ponto A
    TASK_ID_CHARGE: 69,  // template "fast task" -> base de carregamento
    TASK_ID_HOME: 70,    // template "fast task" -> home
  };

  // -----------------------------------------------------------------------
  // Camada de API — testada e funcionando na apresentação. Sem dependência
  // de DOM: pode ser chamada de qualquer UI que a gente construir por cima.
  // -----------------------------------------------------------------------
  async function apiPost(path, body) {
    const opts = { method: 'POST' };
    if (body !== undefined) {
      opts.headers = { 'Content-Type': 'application/json' };
      opts.body = JSON.stringify(body);
    }
    const res = await fetch(CONFIG.API_BASE + path, opts);
    let data = null;
    try { data = await res.json(); } catch (e) { /* resposta vazia ou não-JSON */ }
    if (!res.ok || !data || data.code !== 0) {
      const msg = (data && data.message) || ('Falha HTTP ' + res.status);
      throw new Error(msg);
    }
    return data;
  }

  async function runTask(taskId) {
    if (!taskId) throw new Error('ID da task não configurado.');
    return apiPost('/task-template/generic/task-fast/' + taskId, {});
  }

  async function cancelAllTasks() {
    if (!CONFIG.PROJECT_ID) throw new Error('PROJECT_ID não configurado.');
    return apiPost('/task-record/all-cancel/' + CONFIG.PROJECT_ID);
  }

  window.LIFTY = { CONFIG, apiPost, runTask, cancelAllTasks };
})();
</script>

<script>
(function () {
  'use strict';

  // -----------------------------------------------------------------------
  // Construtor de lotes de armazenamento.
  // 4 slots fixos (um por quartil). Cada slot vazio mostra um botão "+"; ao
  // configurar um lote, o slot passa a mostrar: rótulo "LOTE - {id}", a
  // matriz NxM de seções clicáveis (ID-1, ID-2, ...) e 3 ícones de ação
  // ({ } dev, olho, lixeira). Estado só em memória — nada é persistido
  // entre recarregamentos ainda.
  //
  // AVISO: a senha do modo desenvolvedor é checada aqui no cliente, só
  // como uma trava simples de UI — qualquer pessoa com o devtools aberto
  // consegue ver/ignorar isso. Não é segurança de verdade.
  // -----------------------------------------------------------------------
  const SLOT_COUNT = 4;
  const DEV_PASSWORD = '33dev';
  const lots = new Array(SLOT_COUNT).fill(null);
  let activeSlot = null;
  let pendingDevSlot = null;
  let pendingBind = null; // { lot, label }
  let pendingDeleteSlot = null;

  const grid = document.getElementById('batchGrid');

  const backdrop = document.getElementById('modalBackdrop');
  const idInput = document.getElementById('lotId');
  const colsInput = document.getElementById('lotCols');
  const rowsInput = document.getElementById('lotRows');
  const reverseInput = document.getElementById('lotReverse');

  const devPassBackdrop = document.getElementById('devPassBackdrop');
  const devPassInput = document.getElementById('devPassInput');

  const taskIdBackdrop = document.getElementById('taskIdBackdrop');
  const taskIdInput = document.getElementById('taskIdInput');
  const taskIdSectionLabel = document.getElementById('taskIdSectionLabel');

  const deleteBackdrop = document.getElementById('deleteBackdrop');
  const deleteText = document.getElementById('deleteText');
  const deleteInput = document.getElementById('deleteInput');
  const deleteConfirmBtn = document.getElementById('deleteConfirm');

  const lotViewBackdrop = document.getElementById('lotViewBackdrop');
  const lotViewTitle = document.getElementById('lotViewTitle');
  const lotViewBadge = document.getElementById('lotViewBadge');
  const lotViewGrid = document.getElementById('lotViewGrid');

  const toastEl = document.getElementById('toast');

  // --- toast ---------------------------------------------------------------
  let toastTimer = null;
  function showToast(message, kind) {
    toastEl.textContent = message;
    toastEl.className = 'toast is-visible toast--' + (kind || 'info');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.className = 'toast'; }, 3500);
  }

  // --- cancelar (botão home) / parada de emergência --------------------------
  // A API não expõe cancelamento de uma task específica em andamento — só
  // /task-record/all-cancel/{projectId}, que cancela tudo de uma vez (ver
  // window.LIFTY.cancelAllTasks). Então "cancelar a task atual, se possível"
  // hoje sempre cai direto no fallback: cancela todas. Se o fabricante
  // expuser no futuro um endpoint de cancelamento pontual (por
  // taskRecordId), é aqui que ele entraria, tentado antes do fallback.
  function handleCancelAction(sourceLabel) {
    window.LIFTY.cancelAllTasks()
      .then(function () { showToast(sourceLabel + ': task(s) cancelada(s).', 'success'); })
      .catch(function (err) { showToast('Erro ao cancelar (' + sourceLabel + '): ' + err.message, 'error'); });
  }

  // --- numeração das seções -------------------------------------------------
  function cellNumber(row, col, cols, reverse) {
    return reverse ? (row * cols + (cols - col)) : (row * cols + col + 1);
  }

  // Monta a grade de seções de um lote. onCellClick(lot, label) decide o que
  // acontece ao clicar — o mesmo builder serve pra visão reduzida e pra
  // expandida, então o comportamento é sempre idêntico nas duas.
  function buildLotGrid(lot, onCellClick, showTaskId) {
    const lotEl = document.createElement('div');
    lotEl.className = 'lot';
    lotEl.style.gridTemplateColumns = 'repeat(' + lot.cols + ', 1fr)';
    lotEl.style.gridTemplateRows = 'repeat(' + lot.rows + ', 1fr)';

    for (let r = 0; r < lot.rows; r++) {
      for (let c = 0; c < lot.cols; c++) {
        const n = cellNumber(r, c, lot.cols, lot.reverse);
        const label = lot.id + '-' + n;
        const taskId = lot.tasks[label];

        const cell = document.createElement('button');
        cell.type = 'button';
        cell.className = 'lot__cell';
        cell.setAttribute('aria-label', 'Seção ' + label + (taskId ? (', task ' + taskId) : ''));

        const labelSpan = document.createElement('span');
        labelSpan.className = 'lot__cell-label';
        labelSpan.textContent = label;
        cell.appendChild(labelSpan);

        // Modo desenvolvedor: mostra o ID da task já vinculada, se houver.
        if (showTaskId && taskId) {
          const idSpan = document.createElement('span');
          idSpan.className = 'lot__cell-task';
          idSpan.textContent = '#' + taskId;
          cell.appendChild(idSpan);
        }

        cell.addEventListener('click', function () { onCellClick(lot, label); });
        lotEl.appendChild(cell);
      }
    }
    return lotEl;
  }

  // --- clique numa seção: modo normal (dispara a task vinculada) -----------
  function handleSectionRun(lot, label) {
    const taskId = lot.tasks[label];
    if (!taskId) {
      showToast('Nenhuma task vinculada a ' + label + '.', 'info');
      return;
    }
    window.LIFTY.runTask(taskId)
      .then(function () { showToast('Task enviada: ' + label, 'success'); })
      .catch(function (err) { showToast('Erro ao enviar ' + label + ': ' + err.message, 'error'); });
  }

  // --- clique numa seção: modo desenvolvedor (bind de task) ----------------
  function handleSectionBind(lot, label) {
    pendingBind = { lot: lot, label: label };
    taskIdSectionLabel.textContent = 'Seção ' + label;
    taskIdInput.value = lot.tasks[label] || '';
    taskIdBackdrop.hidden = false;
    taskIdInput.focus();
  }

  // --- grade principal (4 slots) --------------------------------------------
  function renderBatchGrid() {
    grid.innerHTML = '';
    for (let i = 0; i < SLOT_COUNT; i++) {
      const lot = lots[i];

      if (!lot) {
        const square = document.createElement('div');
        square.className = 'lot-card__square';
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'slot-add';
        btn.setAttribute('aria-label', 'Criar novo lote');
        btn.textContent = '+';
        btn.addEventListener('click', function () { openCreateModal(i); });
        square.appendChild(btn);
        grid.appendChild(square);
        continue;
      }

      const card = document.createElement('div');
      card.className = 'lot-card';

      const label = document.createElement('div');
      label.className = 'lot-card__label';
      label.textContent = 'LOTE - ' + lot.id;
      card.appendChild(label);

      const square = document.createElement('div');
      square.className = 'lot-card__square';
      square.appendChild(buildLotGrid(lot, handleSectionRun));
      card.appendChild(square);

      const actions = document.createElement('div');
      actions.className = 'lot-card__actions';

      const devBtn = document.createElement('button');
      devBtn.type = 'button';
      devBtn.className = 'icon-btn';
      devBtn.setAttribute('aria-label', 'Seção de desenvolvedor');
      devBtn.innerHTML = '<span class="icon-btn__glyph">{ }</span>';
      devBtn.addEventListener('click', function () { requestDevAccess(i); });
      actions.appendChild(devBtn);

      const eyeBtn = document.createElement('button');
      eyeBtn.type = 'button';
      eyeBtn.className = 'icon-btn';
      eyeBtn.setAttribute('aria-label', 'Ampliar lote ' + lot.id);
      eyeBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 12S5.5 5 12 5s10.5 7 10.5 7-4 7-10.5 7S1.5 12 1.5 12Z"/><circle cx="12" cy="12" r="3"/></svg>';
      eyeBtn.addEventListener('click', function () { openLotView(lot, false); });
      actions.appendChild(eyeBtn);

      const trashBtn = document.createElement('button');
      trashBtn.type = 'button';
      trashBtn.className = 'icon-btn icon-btn--danger';
      trashBtn.setAttribute('aria-label', 'Remover lote ' + lot.id);
      trashBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M9 7V4.5A1.5 1.5 0 0 1 10.5 3h3A1.5 1.5 0 0 1 15 4.5V7"/><path d="M6.5 7l.8 12.1A2 2 0 0 0 9.3 21h5.4a2 2 0 0 0 2-1.9L18 7"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>';
      trashBtn.addEventListener('click', function () { openDeleteModal(i); });
      actions.appendChild(trashBtn);

      card.appendChild(actions);
      grid.appendChild(card);
    }
  }

  // --- modal: novo lote ------------------------------------------------------
  function openCreateModal(slotIndex) {
    activeSlot = slotIndex;
    idInput.value = '';
    colsInput.value = 3;
    rowsInput.value = 3;
    reverseInput.checked = false;
    backdrop.hidden = false;
    idInput.focus();
  }
  function closeCreateModal() {
    backdrop.hidden = true;
    activeSlot = null;
  }
  document.getElementById('modalCancel').addEventListener('click', closeCreateModal);
  backdrop.addEventListener('click', function (e) { if (e.target === backdrop) closeCreateModal(); });
  document.getElementById('modalCreate').addEventListener('click', function () {
    const id = idInput.value.trim().toUpperCase();
    const cols = parseInt(colsInput.value, 10);
    const rows = parseInt(rowsInput.value, 10);

    if (!id) { idInput.focus(); return; }
    if (!cols || cols < 1 || !rows || rows < 1) return;
    if (activeSlot === null) return;

    lots[activeSlot] = { id: id, cols: cols, rows: rows, reverse: reverseInput.checked, tasks: {} };
    closeCreateModal();
    renderBatchGrid();
  });

  // --- modal: senha de desenvolvedor ------------------------------------------
  function requestDevAccess(slotIndex) {
    pendingDevSlot = slotIndex;
    devPassInput.value = '';
    devPassBackdrop.hidden = false;
    devPassInput.focus();
  }
  function closeDevPassModal() {
    devPassBackdrop.hidden = true;
    pendingDevSlot = null;
  }
  function submitDevPass() {
    if (devPassInput.value === DEV_PASSWORD) {
      const lot = lots[pendingDevSlot];
      closeDevPassModal();
      openLotView(lot, true);
    } else {
      showToast('Senha incorreta.', 'error');
      devPassInput.value = '';
      devPassInput.focus();
    }
  }
  document.getElementById('devPassCancel').addEventListener('click', closeDevPassModal);
  document.getElementById('devPassSubmit').addEventListener('click', submitDevPass);
  devPassBackdrop.addEventListener('click', function (e) { if (e.target === devPassBackdrop) closeDevPassModal(); });
  devPassInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') submitDevPass(); });

  // --- modal: ID da task (bind de seção) --------------------------------------
  function closeTaskIdModal() {
    taskIdBackdrop.hidden = true;
    pendingBind = null;
  }
  function submitTaskId() {
    if (!pendingBind) return;
    const val = taskIdInput.value.trim();
    pendingBind.lot.tasks[pendingBind.label] = val ? parseInt(val, 10) : null;
    showToast((val ? 'Task vinculada a ' : 'Vínculo removido de ') + pendingBind.label + '.', 'success');
    closeTaskIdModal();
    renderLotViewGrid(); // atualiza a grade por trás na hora, sem precisar fechar/reabrir
  }
  document.getElementById('taskIdCancel').addEventListener('click', closeTaskIdModal);
  document.getElementById('taskIdSave').addEventListener('click', submitTaskId);
  taskIdBackdrop.addEventListener('click', function (e) { if (e.target === taskIdBackdrop) closeTaskIdModal(); });
  taskIdInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') submitTaskId(); });

  // --- modal: remover lote (exige digitar "excluir") --------------------------
  function openDeleteModal(slotIndex) {
    pendingDeleteSlot = slotIndex;
    const lot = lots[slotIndex];
    deleteText.innerHTML = 'Digite <strong>excluir</strong> para remover o lote ' + lot.id + '. Isso também apaga os vínculos de task configurados.';
    deleteInput.value = '';
    deleteConfirmBtn.disabled = true;
    deleteBackdrop.hidden = false;
    deleteInput.focus();
  }
  function closeDeleteModal() {
    deleteBackdrop.hidden = true;
    pendingDeleteSlot = null;
  }
  function confirmDelete() {
    if (deleteConfirmBtn.disabled || pendingDeleteSlot === null) return;
    lots[pendingDeleteSlot] = null;
    closeDeleteModal();
    renderBatchGrid();
  }
  deleteInput.addEventListener('input', function () {
    deleteConfirmBtn.disabled = deleteInput.value.trim().toLowerCase() !== 'excluir';
  });
  deleteInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') confirmDelete(); });
  document.getElementById('deleteCancel').addEventListener('click', closeDeleteModal);
  document.getElementById('deleteClose').addEventListener('click', closeDeleteModal);
  deleteConfirmBtn.addEventListener('click', confirmDelete);
  deleteBackdrop.addEventListener('click', function (e) { if (e.target === deleteBackdrop) closeDeleteModal(); });

  // --- lote expandido (olho / dev) --------------------------------------------
  let currentLotView = null; // { lot, devMode } — visão aberta no momento, se houver

  function renderLotViewGrid() {
    if (!currentLotView) return;
    lotViewGrid.innerHTML = '';
    lotViewGrid.appendChild(buildLotGrid(
      currentLotView.lot,
      currentLotView.devMode ? handleSectionBind : handleSectionRun,
      currentLotView.devMode
    ));
  }

  function openLotView(lot, devMode) {
    currentLotView = { lot: lot, devMode: devMode };
    lotViewTitle.textContent = 'LOTE - ' + lot.id;
    lotViewBadge.hidden = !devMode;
    renderLotViewGrid();
    lotViewBackdrop.hidden = false;
  }
  function closeLotView() {
    lotViewBackdrop.hidden = true;
    currentLotView = null;
  }
  document.getElementById('lotViewClose').addEventListener('click', closeLotView);
  lotViewBackdrop.addEventListener('click', function (e) { if (e.target === lotViewBackdrop) closeLotView(); });

  document.getElementById('homeCancelBtn').addEventListener('click', function () { handleCancelAction('Cancelar'); });
  document.getElementById('estopBtn').addEventListener('click', function () { handleCancelAction('Emergência'); });

  // --- fechar qualquer modal com Esc ------------------------------------------
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if (!deleteBackdrop.hidden) closeDeleteModal();
    else if (!taskIdBackdrop.hidden) closeTaskIdModal();
    else if (!lotViewBackdrop.hidden) closeLotView();
    else if (!devPassBackdrop.hidden) closeDevPassModal();
    else if (!backdrop.hidden) closeCreateModal();
  });

  renderBatchGrid();
})();
</script>

</body>
</html>

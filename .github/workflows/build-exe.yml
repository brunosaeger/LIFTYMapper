name: Build LIFTY.exe

# PyInstaller não faz cross-compile Linux->Windows, então o .exe é gerado
# aqui num runner Windows de verdade. Dispara na mão (aba Actions ->
# "Build LIFTY.exe" -> "Run workflow") ou empurrando uma tag v*.
# Gera DOIS artefatos: LIFTY-windows (GUI, uso manual numa máquina com
# alguém na frente) e LIFTY-SERVICE-windows (sem interface, sobe sozinho —
# pensado pra virar Serviço do Windows numa VM, ver MIGRACAO_VM_FINAL.md).
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Build do front (web/dist)
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instala PyInstaller
        run: pip install "pyinstaller==6.11.1"

      - name: Gera o .exe (GUI, uso manual)
        run: pyinstaller packaging/lifty.spec

      - name: Publica o artefato (GUI)
        uses: actions/upload-artifact@v4
        with:
          name: LIFTY-windows
          path: dist/LIFTY.exe
          if-no-files-found: error

      # Versão sem interface (ver packaging/lifty_headless.spec e
      # MIGRACAO_VM.md) — pensada pra rodar como Serviço do Windows numa
      # VM, subindo sozinha no boot sem precisar de ninguém clicando em
      # nada.
      - name: Gera o .exe (sem interface, pra Serviço do Windows)
        run: pyinstaller packaging/lifty_headless.spec

      - name: Publica o artefato (serviço)
        uses: actions/upload-artifact@v4
        with:
          name: LIFTY-SERVICE-windows
          path: dist/LIFTY-SERVICE.exe
          if-no-files-found: error

      # Pacote pronto pra VM (ver packaging/vm/LEIA-ME.txt): .exe + nssm +
      # scripts de teste/instalação + guia. Os DADOS não vão aqui (nunca no
      # GitHub) -- saem da máquina antiga pelo exportar-dados.ps1.
      # nssm 2.24-101 (pré-release recomendada pelo próprio site pra Windows
      # 10+/Server 2016+); cai pra 2.24 se não baixar.
      - name: Monta o pacote da VM
        shell: pwsh
        run: |
          $p = 'pacote/LIFTY-VM'
          New-Item -ItemType Directory -Force $p | Out-Null
          Copy-Item dist/LIFTY-SERVICE.exe, packaging/vm/instalar.ps1, packaging/vm/testar-rede.ps1, packaging/vm/LEIA-ME.txt, MIGRACAO_VM_FINAL.md $p
          $urls = 'https://nssm.cc/ci/nssm-2.24-101-g897c7ad.zip', 'https://nssm.cc/release/nssm-2.24.zip'
          $ok = $false
          foreach ($u in $urls) {
            foreach ($i in 1..3) {
              try { Invoke-WebRequest $u -OutFile nssm.zip -TimeoutSec 60; $ok = $true; break } catch { Write-Warning "$u (tentativa $i): $_"; Start-Sleep 10 }
            }
            if ($ok) { break }
          }
          if (-not $ok) { throw 'nssm.cc fora do ar -- rode o workflow de novo mais tarde.' }
          Expand-Archive nssm.zip nssm
          Copy-Item (Get-ChildItem nssm -Recurse -Filter nssm.exe | Where-Object { $_.FullName -match 'win64' } | Select-Object -First 1).FullName $p

      - name: Publica o pacote da VM
        uses: actions/upload-artifact@v4
        with:
          name: LIFTY-VM
          path: pacote/
          if-no-files-found: error
